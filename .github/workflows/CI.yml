
name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Instalar herramientas Power BI
        run: npm install --no-save --legacy-peer-deps powerbi-visuals-tools eslint

      - name: Corregir dependencias AJV
        run: npm install --no-save --legacy-peer-deps ajv@8 ajv-keywords@5

      - name: Compilar visual Power BI
        run: ./node_modules/.bin/pbiviz package

      - name: Guardar archivo PBIVIZ
        uses: actions/upload-artifact@v4
        with:
          name: QSK60-PowerBI-3D-Viewer
          path: dist/*.pbiviz
          if-no-files-found: error
